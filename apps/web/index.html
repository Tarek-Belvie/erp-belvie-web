<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP. L'API (/api) et les fichiers (/media) sont servis depuis la MÊME origine que l'interface
      (réécritures Vercel en production, proxy Vite en développement) : 'self' suffit.
      Google Fonts : la feuille vient de fonts.googleapis.com, les polices de fonts.gstatic.com.
      blob: dans img-src/connect-src : aperçus et téléchargements générés dans le navigateur.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belvie ERP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
